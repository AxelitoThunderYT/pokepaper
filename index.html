<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokepaper</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--ink:#24213f;--ink2:#6a6687;--bd:#24213f;--paper:#f8f1de;--line:#dde7ee;--card:#fffdf6;--card2:#f3ecd9;--red:#e5483f;--blue:#3d6fd9;--yellow:#ffcc3d;--green:#36ad62;--purple:#8a5cd6;--gold:#e8a91b;--sky1:#9fd6ff;--sky2:#e6f5ff;--gr1:#a9de7c;--gr2:#7cc057;--plat:#86bf5a;--msg:#fff3bf}
@media(prefers-color-scheme:dark){:root{--ink:#efe9d6;--ink2:#a7a3be;--bd:#0c0c17;--paper:#1b1c29;--line:#242839;--card:#2a2b3d;--card2:#33354b;--sky1:#2a3466;--sky2:#5b4e87;--gr1:#3d6b47;--gr2:#2c4f35;--plat:#4f8552;--msg:#4a4226}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:500 17px/1.35 'Fredoka',system-ui,sans-serif;color:var(--ink);background-color:var(--paper);background-image:linear-gradient(90deg,transparent 40px,#e5483f40 40px 42px,transparent 42px),repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);min-height:100vh}
#app{max-width:1040px;margin:auto;padding:10px 16px 48px}
h1,h2,h3{font-weight:700;margin:.3em 0;line-height:1.15}h3{font-size:1.1em}
p{margin:.4em 0}small{font-weight:500}
.i{width:1.15em;height:1.15em;vertical-align:-.22em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i-heart{color:#e5483f}.i-bolt{color:#f0b023}.i-token{color:#f08a24}.i-trophy{color:var(--gold)}.i-sparkle{color:#f0b023}.i-potion{color:#9b59d0}.i-gem{color:#3fb6d9}.i-swirl{color:#e5483f}.i-candy{color:#e266a6}.i-gift{color:#e5483f}.i-medal{color:var(--gold)}.i-crown{color:var(--gold)}.i-check{color:var(--green)}.i-skull{color:var(--ink)}
.ib{width:1.3em;height:1.3em;vertical-align:-.3em;image-rendering:pixelated}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;font:600 1em 'Fredoka',sans-serif;color:var(--ink);background:var(--card);border:2.5px solid var(--bd);border-radius:14px;padding:.45em 1em;box-shadow:0 4px 0 var(--bd);transition:transform .08s,box-shadow .08s,filter .15s;text-decoration:none}
.btn:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px);box-shadow:0 5px 0 var(--bd)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--bd)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--red);color:#fff}.btn.grn{background:var(--green);color:#fff}.btn.blu{background:var(--blue);color:#fff}.btn.ylw{background:var(--yellow);color:#24213f}.btn.prp{background:var(--purple);color:#fff}
.btn.big{font-size:1.2em;padding:.55em 1.4em;border-radius:18px}
.btn.sm{font-size:.82em;padding:.28em .65em;border-radius:10px;box-shadow:0 3px 0 var(--bd)}
.btn.dng{color:var(--red)}
.ctr{text-align:center}.row2{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0 14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font:700 1.9em 'Fredoka',sans-serif;letter-spacing:-.5px;margin:0}
.lg1{display:grid;place-items:center;width:44px;height:44px;background:var(--red);color:#fff;border:2.5px solid var(--bd);border-radius:14px;box-shadow:0 4px 0 var(--bd);transform:rotate(-6deg);font-size:.62em}
.logo em{font-style:normal;color:var(--red)}
nav{display:flex;gap:8px;flex-wrap:wrap}
.nb{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2.5px solid var(--bd);border-radius:12px;padding:6px 11px;box-shadow:0 3px 0 var(--bd);font:600 .9em 'Fredoka',sans-serif;transition:transform .08s}
.nb:hover{background:var(--yellow);color:#24213f}.nb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--bd)}
.nb.dng{color:var(--red)}.nb.dng:hover{background:var(--red);color:#fff}
@media(max-width:680px){.nb span{display:none}.logo{font-size:1.5em}.lg1{width:38px;height:38px}}
/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:var(--card);border:2.5px solid var(--bd);border-radius:18px;padding:8px 12px;box-shadow:0 4px 0 var(--bd);margin-bottom:10px}
.mtag{display:inline-flex;align-items:center;gap:6px;background:var(--c);color:#fff;border-radius:999px;padding:3px 12px;font-weight:600;border:2px solid var(--bd)}
.bdgs{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.bdgs>small{margin-right:4px;color:var(--ink2)}
.bdg{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--ink2);color:var(--ink2);opacity:.55;font-size:.75em}
.bdg.on{opacity:1;border:2px solid var(--bd);background:radial-gradient(circle at 35% 30%,#fff9,transparent 45%),var(--c);color:#fff;box-shadow:0 2px 0 var(--bd)}
.hud .grow{flex:1}
.st1{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border-radius:999px;padding:3px 11px}.st1 small{color:var(--ink2)}
@media(max-width:560px){.st1 small,.bdgs>small{display:none}}
/* Journey */
.jr{display:flex;align-items:flex-start;gap:4px;margin:4px 0 10px;overflow-x:auto;padding:2px 2px 6px}
.js{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:70px;text-align:center;opacity:.5}
.jd{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:2.5px solid var(--bd);background:var(--card)}
.js.done{opacity:.9}.js.done .jd{background:var(--green);color:#fff}.js.done .i-check{color:#fff}
.js.now{opacity:1}.js.now .jd{background:var(--yellow);color:#24213f;animation:pulse 1.4s infinite}
.js small{font-size:.72em;font-weight:600;line-height:1.1}
.jl{flex:1;min-width:12px;height:3px;background:var(--ink2);opacity:.35;border-radius:3px;margin-top:18px}
@keyframes pulse{50%{box-shadow:0 0 0 6px #ffcc3d55}}
/* Mensajes */
.msg{display:flex;gap:10px;align-items:flex-start;font:1.12em/1.3 'Patrick Hand',cursive;background:var(--msg);border:2.5px solid var(--bd);border-radius:14px;padding:8px 14px;margin:8px 0 12px;box-shadow:0 3px 0 var(--bd);animation:pop .35s}
.msg .mi{color:var(--red);margin-top:2px}
.tut{display:flex;gap:12px;align-items:flex-start;background:color-mix(in srgb,var(--blue) 12%,var(--card));border:2.5px dashed var(--blue);border-radius:16px;padding:10px 14px;margin:8px 0 12px}
.tuti{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--blue);color:#fff;flex:none;font-size:1.2em}
.panel{background:var(--card);border:2.5px solid var(--bd);border-radius:20px;padding:16px;box-shadow:0 5px 0 var(--bd);margin:12px 0}
.fact{display:flex;gap:10px;align-items:center;background:var(--msg);border:2.5px solid var(--bd);border-radius:14px;padding:8px 14px;margin:14px 0;font:1.08em 'Patrick Hand',cursive;box-shadow:0 3px 0 var(--bd)}
/* Tarjetas */
.tm{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.pk{position:relative;background:var(--card);border:2.5px solid var(--bd);border-radius:18px;box-shadow:0 4px 0 var(--bd);display:flex;flex-direction:column;text-align:center;transition:transform .15s}
.pk:hover{transform:translateY(-2px)}
.pkh{position:relative;height:106px;border-radius:15px 15px 0 0;background:radial-gradient(ellipse 46% 16% at 50% 86%,#0002 0 98%,transparent),linear-gradient(160deg,color-mix(in srgb,var(--tc) 45%,#fff),var(--tc));display:grid;place-items:center;overflow:hidden;border-bottom:2.5px solid var(--bd)}
.pkh::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,#fff1 0 8px,transparent 8px 16px)}
.pkh img{position:relative;width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 3px 0 #0003)}
.rk{position:absolute;top:6px;left:6px;background:#24213fcc;color:#fff;font-size:.68em;font-weight:700;border-radius:8px;padding:1px 6px}
.shb{position:absolute;top:4px;right:6px;font-size:1.1em}
.pkb{padding:8px 8px 10px;display:flex;flex-direction:column;gap:5px}
.nm{font-size:1.02em;line-height:1.1}.pkb>small{color:var(--ink2);margin-top:-4px}
.tys{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:3px;background:var(--c);color:#fff;border-radius:999px;padding:1px 8px 1px 5px;font-size:.72em;font-weight:600;text-shadow:0 1px 0 #0004;border:1.5px solid #0003;white-space:nowrap}
.chip .i{width:1.05em;height:1.05em}
.hp{height:10px;background:#00000022;border-radius:6px;overflow:hidden;border:1.5px solid var(--bd)}
.hp i{display:block;height:100%;border-radius:3px}
.hp i.anim{animation:hpA .7s var(--dl,0s) both}@keyframes hpA{from{width:var(--a)}to{width:var(--b)}}
.sts{display:flex;justify-content:center;gap:12px;font-size:.88em;font-weight:600}
.mv{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;font-size:.72em}
.mv span{border:1.5px solid var(--c);border-radius:8px;padding:0 5px;background:color-mix(in srgb,var(--c) 16%,transparent)}
.pka{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:5px}
.pka .ev{background:var(--yellow);color:#24213f}
.pk.f{filter:grayscale(1);opacity:.55}
.pk.empty{border-style:dashed;border-color:var(--ink2);box-shadow:none;min-height:200px;display:grid;place-items:center;color:var(--ink2);opacity:.45;background:transparent;font-size:2em}
.pk.evofx .pkh img{animation:evo 1.5s}@keyframes evo{0%,55%{filter:brightness(0) invert(1) drop-shadow(0 0 14px #fff)}100%{filter:none}}
.pk.empty{min-height:180px}@media(max-width:620px){.pk.empty{display:none}.tm{grid-template-columns:repeat(2,1fr)}}
.pk.newc{outline:4px solid var(--yellow);outline-offset:3px}
@media(hover:hover){.pk[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#24213f;color:#fff;padding:8px 11px;border-radius:12px;white-space:pre;font-size:.78em;z-index:6;text-align:left;pointer-events:none;box-shadow:0 4px 0 #0005;line-height:1.4}}
.pkbtn{all:unset;display:block;cursor:pointer;border-radius:18px}.pkbtn:focus-visible{outline:3px solid var(--yellow)}
.pkbtn .pk:hover{transform:translateY(-4px) rotate(-.6deg)}
.shn{animation:gl 1.1s infinite alternate}@keyframes gl{to{filter:drop-shadow(0 0 12px gold) brightness(1.18)}}
.q{font-size:2.6em;opacity:.35}
.team{margin-top:18px}.th{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.dead{margin-top:10px;font-size:.9em;color:var(--ink2)}
/* Combate */
.bhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.bhead .bi2{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--red);color:#fff;border:2.5px solid var(--bd);font-size:1.3em}
.bhead h2{margin:0}.bhead small{color:var(--ink2)}
.arena{position:relative;height:340px;border:2.5px solid var(--bd);border-radius:22px;overflow:hidden;box-shadow:0 5px 0 var(--bd);background:linear-gradient(var(--sky1),var(--sky2) 54%,var(--gr1) 54%,var(--gr2))}
.arena::before{content:'';position:absolute;left:0;right:0;top:54%;height:3px;background:#0001}
.cloud{position:absolute;width:90px;height:26px;background:#fff9;border-radius:20px;animation:cl 40s linear infinite}.cloud::before{content:'';position:absolute;width:44px;height:30px;left:16px;top:-14px;background:inherit;border-radius:50%}
@keyframes cl{from{transform:translateX(-120px)}to{transform:translateX(1100px)}}
.plat{position:absolute;width:40%;height:50px;border-radius:50%;background:radial-gradient(ellipse at 50% 45%,var(--plat) 0 58%,color-mix(in srgb,var(--plat) 70%,#000) 60% 66%,transparent 68%)}
.plat.foe{right:3%;top:41%}.plat.me{left:2%;bottom:5%}
.spr{position:absolute;display:grid;place-items:center;z-index:1}
.spr .sw{width:100%;height:100%;display:grid;place-items:center}
.spr img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 0 #0002)}
.spr.foe{width:150px;height:150px;right:10%;top:9%}.spr.me{width:180px;height:180px;left:8%;bottom:8%}
.spr.ph .sw{border:3px dashed #fff8;border-radius:50%;width:60%;height:60%;margin:auto;color:#fff;font-size:2em}
.spr.me.lunge .sw{animation:lr .42s var(--ld,0s)}@keyframes lr{45%{transform:translate(34px,-18px)}}
.spr.foe.lunge .sw{animation:ll .42s var(--ld,0s)}@keyframes ll{45%{transform:translate(-34px,18px)}}
.spr.hurt img{animation:hurt .55s var(--hd,0s)}@keyframes hurt{0%,100%{transform:none;filter:none}20%,60%{transform:translateX(-9px);filter:brightness(2.6)}40%,80%{transform:translateX(9px);filter:brightness(1)}}
.spr.ko{animation:ko .6s var(--kd,0s) forwards}@keyframes ko{to{transform:translateY(45px);opacity:0}}
.spr.enter{animation:ent .45s var(--ed,0s) both}@keyframes ent{from{transform:scale(0) translateY(30px);opacity:0}}
.spr.down{opacity:.25;filter:grayscale(1)}
.spr.healfx img{animation:hfx 1.1s}@keyframes hfx{35%{filter:brightness(1.5) drop-shadow(0 0 16px #7f7)}}
.dmg{position:absolute;top:4%;left:50%;font:700 1.7em 'Fredoka',sans-serif;color:#fff;text-shadow:0 3px 0 #24213f,2px 0 0 #24213f,-2px 0 0 #24213f,0 -2px 0 #24213f;opacity:0;animation:flt 1.2s var(--fd,0s) forwards;white-space:nowrap;z-index:3;pointer-events:none}
.dmg.se{color:#ffcc3d;font-size:2em}.dmg.miss{color:#d6dcea;font-size:1.25em}.dmg .i{color:#ffcc3d}
@keyframes flt{0%{opacity:0;transform:translate(-50%,12px) scale(.5)}15%{opacity:1;transform:translate(-50%,-6px) scale(1.18)}70%{opacity:1;transform:translate(-50%,-16px)}100%{opacity:0;transform:translate(-50%,-44px)}}
.ibox{position:absolute;z-index:2;background:var(--card);border:2.5px solid var(--bd);border-radius:14px;padding:7px 11px;box-shadow:0 4px 0 var(--bd);width:min(46%,285px);font-size:.95em;display:flex;flex-direction:column;gap:4px}
.ibox.foe{left:12px;top:12px}.ibox.me{right:12px;bottom:12px}.ibox.enter{animation:ent .45s var(--ed,0s) both}
.ibt{display:flex;justify-content:space-between;gap:6px;align-items:center}.ibt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibox .tys{justify-content:flex-start}.ibf{display:flex;justify-content:space-between;align-items:center;font-size:.85em;font-weight:600}
.pdots{display:flex;gap:4px}.pdots i{width:10px;height:10px;border-radius:50%;background:var(--green);border:1.5px solid var(--bd)}.pdots i.ko{background:#999;opacity:.45}.pdots i.cur{box-shadow:0 0 0 2px var(--yellow)}
@media(max-width:620px){.arena{height:310px}.spr.foe{width:108px;height:108px;right:5%;top:20%}.spr.me{width:118px;height:118px;left:2%;bottom:26%}.ibox{width:60%;font-size:.8em;padding:5px 8px}.plat{width:46%}.plat.me{bottom:22%}.plat.foe{top:47%}}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.act{position:relative;display:flex;align-items:center;gap:10px;text-align:left;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 72%,#fff),var(--c));color:#fff;border:2.5px solid var(--bd);border-radius:16px;padding:10px 12px;box-shadow:0 4px 0 var(--bd);text-shadow:0 1px 0 #0006;font:inherit;transition:transform .08s}
.act b{display:block;font-size:1.05em}.act small{opacity:.95;font-size:.8em}
.act .ai{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#ffffff38;font-size:1.35em;flex:none}
.act .kb{position:absolute;top:5px;right:8px;font-size:.66em;border:1.5px solid #fff9;border-radius:5px;padding:0 5px;opacity:.85}
.act.sw{--c:#3d6fd9}.act.hl{--c:#36ad62}
.act:hover:not(:disabled){transform:translateY(-2px)}.act:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--bd)}.act:disabled{opacity:.45;cursor:not-allowed}
@media(hover:none){.kb,.keys{display:none}}
.keys{font-size:.78em;color:var(--ink2);text-align:right;margin-top:6px}
.dlg{font:1.12em/1.3 'Patrick Hand',cursive;background:var(--card);border:2.5px solid var(--bd);border-radius:16px;padding:10px 16px;margin-top:12px;box-shadow:inset 0 0 0 4px var(--card2),0 4px 0 var(--bd)}
.dlg p{margin:3px 0;animation:fin .4s both}.dlg p:nth-child(2){animation-delay:.6s}.dlg p:nth-child(3){animation-delay:1.1s}.dlg p:nth-child(4){animation-delay:1.5s}.dlg p:nth-child(5){animation-delay:1.8s}
@keyframes fin{from{opacity:0;transform:translateY(5px)}}
.res{margin:14px 0;text-align:center;font:700 1.6em 'Fredoka',sans-serif;border:2.5px solid var(--bd);border-radius:18px;padding:12px;box-shadow:0 5px 0 var(--bd);animation:pop .5s}
.res.w{background:var(--yellow);color:#24213f}.res.l{background:#5b5672;color:#fff}
/* Modo */
.hero{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;background:linear-gradient(135deg,var(--red),#f37b45);color:#fff;border:2.5px solid var(--bd);border-radius:24px;padding:20px 22px;box-shadow:0 5px 0 var(--bd)}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;border:14px solid #ffffff1c}.hero::before{width:220px;height:220px;right:-60px;top:-90px}.hero::after{width:120px;height:120px;left:38%;bottom:-70px}
.hero h2{font-size:1.75em;margin:0}.hero p{margin:4px 0 0;opacity:.95}.hero>*{position:relative;z-index:1}
.seg{display:inline-flex;align-items:center;gap:4px;background:#ffffff2a;border:2px solid #ffffff66;border-radius:14px;padding:4px}
.seg>span{padding:0 6px;font-weight:600}
.seg button{border:0;background:transparent;color:#fff;border-radius:10px;padding:5px 12px;font:600 .95em 'Fredoka',sans-serif;display:inline-flex;gap:5px;align-items:center}
.seg button.on{background:#fff;color:var(--red)}
.seg.pl{background:var(--card2);border-color:var(--bd)}.seg.pl button{color:var(--ink)}.seg.pl button.on{background:var(--red);color:#fff}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:14px;margin-top:14px}
.mode{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:flex-start;background:var(--card);border:2.5px solid var(--bd);border-radius:20px;padding:14px;box-shadow:0 5px 0 var(--bd);transition:transform .12s}
.mode:hover{transform:translateY(-3px) rotate(-.4deg)}.mode:focus-visible{outline:3px solid var(--yellow)}
.mode .mi{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--c);color:#fff;font-size:1.65em;border:2.5px solid var(--bd);flex:none;box-shadow:0 3px 0 var(--bd)}
.mode b{display:block;font-size:1.18em;margin-bottom:2px}.mode small{display:block;font-size:.88em;color:var(--ink2)}
.mode.on{background:color-mix(in srgb,var(--purple) 14%,var(--card))}
.sub2{margin-top:12px;padding:12px;border:2.5px dashed var(--purple);border-radius:20px;animation:pop .3s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.stat{background:var(--card);border:2.5px dashed var(--ink2);border-radius:16px;padding:10px;text-align:center}.stat b{display:block;font-size:1.5em}.stat small{color:var(--ink2)}
.starters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:12px}
.stc{all:unset;cursor:pointer;box-sizing:border-box;background:var(--card);border:2.5px solid var(--bd);border-radius:22px;box-shadow:0 5px 0 var(--bd);text-align:center;padding:14px;transition:transform .15s}
.stc:hover{transform:translateY(-5px) rotate(-1deg)}.stc:focus-visible{outline:3px solid var(--yellow)}
.stc .stg{height:170px;border-radius:16px;background:radial-gradient(ellipse 42% 12% at 50% 88%,#0002 0 98%,transparent),linear-gradient(var(--sky1),var(--sky2));display:grid;place-items:center;border:2px solid var(--bd)}
.stc img{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 4px 0 #0002)}.stc b{display:block;font-size:1.3em;margin-top:8px}
/* Captura */
.route{padding:0;overflow:hidden}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:2.5px solid var(--bd);background:var(--card2)}

const rulesHtml=`${backBar('RX','Volver')}<div class=lg id=rules><div class="panel rules"><h2>📜 Reglas del juego</h2>
<h3>🗺 Modos</h3><p><b>Normal:</b> un Pokémon debilitado no puede usarse el resto del tramo y revive al completar un gimnasio (no hay reanimación entre los combates de la Liga). <b>Nuzlocke:</b> un debilitado muere para siempre y suma al contador de muertos; si caen todos, pierdes la partida. Liberar a un Pokémon no cuenta como muerte, pero no podrás recuperarlo. <b>Tutorial:</b> guía paso a paso con parámetros fijos. <b>Random Normal:</b> iniciales (3 al azar de 15) y rutas aleatorias (4 Pokémon por ruta): hasta el 5.º gimnasio solo salen primeras fases y especies de una etapa; después, cualquier fase con bono de evolución; desde el 6.º, también los legendarios. <b>Random Total:</b> igual, y además los Pokémon de entrenadores, líderes y Alto Mando son aleatorios con sus estadísticas originales.</p>
<h3>⚪ Capturas</h3><p>Una oportunidad por ruta. Dado 1-3: capturado; 4-5: segunda tirada (1-3 capturado, si no escapa); 6: huye. Las rutas bonus solo se consiguen con la Lucky Box. Cada Pokémon (iniciales incluidos) tiene 1/25 de ser ✨shiny, con +2 de poder y salud; se ve antes de capturarlo. El equipo es de máximo 6: si capturas con el equipo lleno, liberas a uno o dejas ir al nuevo.</p>
<h3>📊 Estadísticas y ataques</h3><p>Poder y vida iniciales = dado × 2, más el bono de rango al capturar. La salud no supera la salud máxima (igual al poder, salvo con Gigamax). Un tipo: ambos ataques de ese tipo. Dos tipos: un ataque de cada uno, al azar.</p>
<h3>⚔ Combate</h3><p>Cada turno eliges: <b>básico</b> (daño base ⌊poder/2⌋), <b>cargado</b> (⌊3·poder/4⌋; falla con 1-3), <b>cambiar</b> o <b>curar</b> (consumen el turno y el rival ataca). Modificador por dado: 1 = −2, 2 = −1, 3-4 = 0, 5 = +1, 6 = +2. Daño mínimo 0; supereficaz +2. Los entrenadores comunes solo usan el básico; líderes y Alto Mando a veces usan el cargado. Si los últimos Pokémon de ambos bandos caen en el mismo turno, pierdes.</p>
<h3>💊 Curación</h3><p>Curar restaura toda la vida de un Pokémon. Empiezas con 1 curación y ganas 1 más tras cada gimnasio; se acumulan si no las usas. Ganar a un entrenador cura +2 a todo el equipo y a un líder +5.</p>
<h3>🏅 Progresión</h3><p>Inicial → 2 capturas → entrenador → líder, repetido en los 8 gimnasios; tras el 8.º hay 2 capturas más y la Liga (4 combates seguidos + campeón). Los gimnasios dan fichas de evolución: 1, 2 y 3 desde el tercero. Evolucionar (solo entre combates) cuesta fichas según el rango, da bonos de poder y salud y cura toda la vida.</p>
<h3>🎁 Lucky Box</h3><p>Tras cada gimnasio. Gym 1-3: 1-3 captura extra, 4-6 curación de +6 al equipo. Desde el Gym 4: 1-2 captura extra, 3-4 curación +6, 5-6 evolución (+3 fichas o forma regional, que cambia tipos y ataques).</p>
<h3>💎 Recompensa de Giovanni</h3><p>Eliges una: <b>Megapiedra</b> (+5 de poder a un Pokémon que pueda megaevolucionar) o <b>Gigamax</b> (+5 de salud máxima y curación total).</p>
<h3>👑 Rangos</h3><p>R1: 1 ficha, +2 al evolucionar. R2: 2 fichas, +3. R3: 2 fichas, +2 al capturar y +3 al evolucionar. R4: 3 fichas, +4. R5: 3 fichas, +2 al capturar y +4 al evolucionar. R6: 5 fichas, +6. R7: +4 al capturar. R8: +10 al capturar.</p>
<h3>⌨ Atajos</h3><p>En combate: 1 Básico · 2 Cargado · 3 Cambiar · 4 Curar · Esc cancelar. Espacio/Enter pulsa el botón principal (explorar, lanzar, combatir, abrir, continuar).</p></div></div>`;

 if(S.mode=='rt')l=l.map(([n,p,h])=>{const q=ALL.filter(x=>k=='liga'||!LEG.includes(x));return[nmz(q[Math.random()*q.length|0]),p,h]});
 const mons=await Promise.all(l.map(([n,p,h])=>mk(n,p,h)));mons.forEach(m=>m.fo=1);S.B={kind:k,title:t,mons,fi:0,cur:null};S.ph='pick';S.lg=[];S.sub=null;S.hit={start:1};R()}

 const r=d6(),m=[-2,-1,0,0,1,2][r-1],se=d.t.some(t=>SE[ty].includes(t));let x=Math.max(0,base+m);if(se)x+=2;

function turn(act,i){const B=S.B,me=B.cur,foe=B.mons[B.fi],L=[];let dF=0,m1=null;S.sub=null;const H={act,foe,fa:pct(foe)};
 if(act=='sw'){B.cur=S.team[i];L.push(`🔄 Cambias a ${B.cur.n}.`);H.sw=1}
 else if(act=='heal'){const p=S.team[i];S.heals--;S.usedHeal=1;p.H=p.M;L.push(`💊 ${p.n} se cura por completo (${p.M} PS).`);H.heal=p;sfx('heal')}
 else{const[x,t,m]=atkCalc(me,foe,act=='c',me.n);dF=x;m1=m;L.push(t)}
 const tg=B.cur;H.ma=pct(tg);const[x2,t2,m2]=atkCalc(foe,tg,B.kind!='trainer'&&Math.random()<.3,foe.n+' (rival)');L.push(t2);
 foe.H=Math.max(0,foe.H-dF);tg.H=Math.max(0,tg.H-x2);
 if(tg.H<=0){L.push(`💥 ${tg.n} se debilita.`);if(S.mode=='nuz'){S.team=S.team.filter(p=>p!==tg);S.dead.push(tg);S.deaths++}else tg.f=1}

 S.lg=L;const left=B.mons.some(m=>m.H>0);
 if(!alive().length){S.won=0;S.res=()=>lose(left?'':'Los últimos Pokémon de ambos bandos cayeron en el mismo turno.');S.ph='end'}

 return `<div class=arena><div class=cloud style="top:8%;animation-delay:-8s"></div><div class=cloud style="top:26%;animation-delay:-26s;transform:scale(.7)"></div><div class="plat foe"></div><div class="plat me"></div>${fs}${ms}${fi}${mi}</div>`}
const bhead=()=>{const k=S.B.kind,e=k=='trainer'?'🧢':k=='gym'?'🛡':S.li==4?'👑':'🛡';return `<div class=bhead><span class=bi2>${e}</span><div><h2>${S.B.title}</h2><small>Rival ${S.B.fi+1}/${S.B.mons.length}</small></div></div>`};
const log=()=>S.lg.length?`<div class=dlg>${S.lg.map(x=>`<p>${x}</p>`).join('')}</div>`:'';
const confetti=()=>`<div class=conf>${Array.from({length:46},(_,i)=>`<i style="left:${Math.random()*100}%;background:${['#e5483f','#ffcc3d','#3d6fd9','#36ad62','#8a5cd6'][i%5]};animation-delay:${(Math.random()*3).toFixed(2)}s;animation-duration:${(2.6+Math.random()*2).toFixed(2)}s"></i>`).join('')}</div>`;
const modeCard=(on,ico,c,t,d,cls='')=>`<button class="mode ${cls}" onclick="${on}"><span class=mi style="--c:${c}">${ico}</span><span><b>${t}</b><small>${d}</small></span></button>`;
function modeHtml(){const dn=ALL.filter(x=>DEX[x]).length;return `<section class=hero><div><h2>¡Tu aventura de dados y papel!</h2><p>Captura, entrena y lanza los dados hasta la Liga.</p></div><div class=seg><span>🖼 Imágenes:</span><button class="${SET.pm?'':'on'}" onclick="SET.pm=0;sS();R()">Normal</button><button class="${SET.pm?'on':''}" onclick="SET.pm=1;sS();R()">🎨 Pintor</button></div></section>
<div class=fact id=fact>💡 <span>${FACTS[FI]}</span></div><h2 class=ctr>Elige el modo de juego</h2>
<div class=modes>${modeCard("init('normal')",'🗺','#3d6fd9','Modo normal','Los Pokémon debilitados quedan fuera hasta completar el gimnasio, cuando reviven.')}${modeCard("init('nuz')",'☠','#3b3550','Modo Nuzlocke','Un Pokémon debilitado muere para siempre. Si caen todos, pierdes la partida.')}${modeCard("init('tut')",'🎓','#36ad62','Tutorial','Aprende las mecánicas paso a paso.')}${modeCard('RM=!RM;R()','🎲','#8a5cd6','Modo Random','Iniciales y Pokémon aleatorios.',RM?'on':'')}</div>
${RM?`<div class=sub2><div class=modes style="margin:0">${modeCard("init('rn')",'🎲','#8a5cd6','Random Normal','Iniciales y rutas aleatorias; los rivales no cambian.')}${modeCard("init('rt')",'🎲','#c0399b','Random Total','Además, entrenadores, líderes y Alto Mando son aleatorios.')}</div></div>`:''}
<div class=stats><div class=stat>🏆<b>${ST.w}</b><small>Victorias</small></div><div class=stat>☠<b>${ST.nw}</b><small>Nuzlocke</small></div><div class=stat>📖<b>${dn}/${ALL.length}</b><small>Pokédex</small></div><div class=stat>🏅<b>${Object.keys(ST.u).length}/${AC.length}</b><small>Logros</small></div></div>`}
function R(){
 if(RX){const i=rulesHtml.indexOf('<div class=lg');$('#app').innerHTML=conv(tr(rulesHtml.slice(0,i))+rulesHtml.slice(i));return}
 if(SX)return out(setHtml());if(AX)return out(achHtml());if(DX)return out(dexHtml());
 const ph=S.ph;let h=topBar();
 if(ph=='mode')h+=modeHtml();
 else{if(ph!='starter')h+=hud();h+=journey();
 if(S.msg&&ph!='over')h+=`<div class=msg><span class=mi>💬</span><span>${S.msg}</span></div>`;if(S.mode=='tut'&&tip())h+=`<div class=tut><span class=tuti>🎓</span><div><b>Tutorial:</b> ${tip()}</div></div>`;
 if(ph=='starter')h+=`<h2 class=ctr>Elige a tu Pokémon inicial</h2><div class=starters>${(S.stl||[['Bulbasaur',1],['Charmander',4],['Squirtle',7]]).map(([n,i],k)=>`<button class=stc onclick="starter('${n}',${k})"><div class=stg><img class="${S.sh[k]?'shn':''}" src="${ART(S.sh[k]?'shiny/'+i:i)}" alt=""></div><b>${S.sh[k]?'✨ ':''}${n}</b><small>#${String(i).padStart(3,'0')}</small></button>`).join('')}</div>`;
 else if(ph=='load')h+=`<div class=load>${ic('loader')}<span>Cargando…</span></div>`;
 else if(ph=='cap'){const c=S.q[0];h+=`<div class="panel route"><div class=rhead><span class=sign>🗺 ${c.l}</span><span class=rleft>${S.q.map((_,i)=>`<i class="${i?'':'cur'}"></i>`).join('')} Quedan ${S.q.length} ruta(s) en este tramo.</span></div>
 <div class=scene>${c.mon?`<div class=wild>${c.img?`<img class="${c.sh?'shn':''}" src="${c.img}" alt="">`:'<span class=q>❓</span>'}</div><div class=wname>${c.sh?'✨ ':''}${c.mon}${c.sh?' SHINY ✨':''}</div>`:`<div class=bush>🌿</div>`}<div class=tufts>${'<span>🌿</span>'.repeat(9)}</div></div>
 <div class=rbody>${c.mon?`<p>¡Un ${c.mon} salvaje! Solo tienes un intento por ruta.</p><button class="btn big pri" data-k=Enter onclick="ball()">⚪ Lanzar Pokéball</button>`:`<p>Solo tienes un intento por ruta.</p><div class=odds>${c.t.map((n,i)=>`<span>🎲${i+1} ${n=='DADOS'?'¡Evento Dados!':n}</span>`).join('')}</div><button class="btn big grn" data-k=Enter onclick="explore()">🎲 Explorar ruta</button>`}</div></div>`}
 else if(ph=='rel')h+=`<div class=panel><h2>⚪ Equipo completo</h2><p>Libera a uno de tus Pokémon para que entre <b>${S.pend.n}</b> (poder ${S.pend.P}).</p><div class=tm style="max-width:200px">${card(S.pend,'','newc')}</div><p><button class="btn" onclick="skip()">🚫 No capturarlo (dejarlo ir)</button></p></div>`;
 else if(ph=='hub'){const k=S.next,w=k=='trainer'?'Entrenador '+(S.g+1):k=='gym'?'Líder '+GY[S.g][0]:LG[S.li][0],e=k=='trainer'?['🧢','#3d6fd9']:k=='gym'?['🛡',TY[GT[S.g]][1]]:S.li==4?['👑','#e8a91b']:['🛡','#6f35fc'];h+=`<div class="panel next"><span class=nxi style="--c:${e[1]}">${e[0]}</span><div class=grow><small>Siguiente combate</small><h2>${w}</h2><p>Evoluciona o libera Pokémon ahora; no se puede durante el combate.</p></div><div class=row2><button class="btn big pri" data-k=Enter onclick="fight()">⚔ Combatir</button>${S.mode=='tut'&&!S.tlb?'<button class="btn big ylw" onclick="tlb()">🎁 Probar Lucky Box</button>':''}</div></div>`}
 else if(ph=='luck')h+=`<div class="panel ctr"><div class=giftbig>🎁</div><h2>Lucky Box</h2><p>Un premio por tu esfuerzo. ¿Qué habrá dentro?</p><button class="btn big ylw" data-k=Enter onclick="luck()">🎲 Abrir</button></div>`;
 else if(ph=='luckevo')h+=`<h2 class=ctr>🍬 Evolución</h2><div class=choice><div class=opt><span class=oi style="--c:#f08a24">🔸</span><b>+3 fichas de evolución</b><small>Úsalas con ⬆ en tu equipo.</small><button class="btn ylw" onclick="ficha()">+3 fichas de evolución</button></div><div class=opt><span class=oi style="--c:#3d6fd9">🌐</span><b>…o cambiar a forma regional:</b><small>Cambia sus tipos y, con ellos, sus ataques.</small><div class=row2>${S.rg.map(([i,x],k)=>`<button class="btn blu sm" onclick="regional(${k})">${S.team[i].n} → ${x}</button>`).join('')||'<small>Ninguno de tus Pokémon tiene forma regional disponible.</small>'}</div></div></div>`;
 else if(ph=='stone'){const o=S.team.map((p,i)=>[p,i]),mg=o.filter(([p])=>MEGA.has(p.s)&&!p.mg),gx=o.filter(([p])=>GIGA.has(p.s));h+=`<h2 class=ctr>🏆 Recompensa de Giovanni</h2><p class=ctr>Elige <b>una</b>: una Megapiedra (+5 de poder a un Pokémon que pueda megaevolucionar) o un Gigamax (+5 de salud máxima y curación total).</p><div class=choice>${mg.length?`<div class=opt><span class=oi style="--c:#3fb6d9">💎</span><b>Megapiedra</b><small>+5 de poder</small><div class=row2>${mg.map(([p,i])=>`<button class="btn sm" onclick="stone(${i},1)">💎 Mega ${p.n}</button>`).join('')}</div></div>`:''}${gx.length?`<div class=opt><span class=oi style="--c:#e5483f">🌀</span><b>Gigamax</b><small>+5 de salud máxima y curación total</small><div class=row2>${gx.map(([p,i])=>`<button class="btn sm" onclick="stone(${i},2)">🌀 Gigamax ${p.n}</button>`).join('')}</div></div>`:''}</div>`}
 else if(ph=='pick')h+=`${bhead()}${arena()}${log()}<div class=panel><h3>⚪ Elige tu Pokémon</h3><div class=tm>${S.team.map((p,i)=>!p.f&&p.H>0?`<button class=pkbtn onclick="lead(${i})">${card(p)}</button>`:'').join('')}</div></div>`;
 else if(ph=='battle'){const me=S.B.cur,sub=S.sub;h+=bhead()+arena();
  if(sub){const o=S.team.map((p,i)=>({p,i})).filter(({p})=>!p.f&&p.H>0&&(sub=='sw'?p!==me:p.H<p.M));h+=`<div class=panel><div class=th><h3>${sub=='sw'?'🔄 ¿A quién sacas?':'💊 ¿A quién curas? (recupera toda su vida)'}</h3><button class="btn sm" data-k=Escape onclick="S.sub=null;R()">← Cancelar</button></div><div class=tm>${o.map(({p,i})=>`<button class=pkbtn onclick="turn('${sub}',${i})">${card(p)}</button>`).join('')||'<p>Nadie necesita curación.</p>'}</div></div>`}
  else h+=`<div class=acts><button class=act style="--c:${TY[me.a[0]][1]}" data-k=1 onclick="turn('b')"><span class=kb>1</span><span class=ai>${tyIc(me.a[0])}</span><span><b>Básico</b><small>${TY[me.a[0]][0]} · ${Math.floor(me.P/2)} de daño</small></span></button><button class=act style="--c:${TY[me.a[1]][1]}" data-k=2 onclick="turn('c')"><span class=kb>2</span><span class=ai>${tyIc(me.a[1])}</span><span><b>Cargado</b><small>${TY[me.a[1]][0]} · ${Math.floor(3*me.P/4)} · falla 50%</small></span></button><button class="act sw" data-k=3 onclick="S.sub='sw';R()"><span class=kb>3</span><span class=ai>🔄</span><span><b>Cambiar</b><small>Gasta tu turno</small></span></button><button class="act hl" data-k=4 ${S.heals>0?'':'disabled'} onclick="S.sub='heal';R()"><span class=kb>4</span><span class=ai>💊</span><span><b>Curar</b><small>${S.heals} disponible(s)</small></span></button></div><div class=keys>⌨ 1 · 2 · 3 · 4</div>`;h+=log()}
 else if(ph=='end')h+=`${bhead()}${arena()}${log()}<div class="res ${S.won?'w':'l'}">${S.won?'🏆 ¡Ganaste el combate!':'💀 Perdiste el combate'}</div><p class=ctr><button class="btn big ${S.won?'ylw':''}" data-k=Enter onclick="S.res()">Continuar ▶</button></p>`;
 else if(ph=='over')h+=`<div class="panel big-end"><span class=eico>💀</span><h2>Fin de la partida</h2><p>${S.msg||''} Llegaste a ${S.g} gimnasio(s).${S.mode=='nuz'?` Pokémon muertos: ${S.deaths}.`:''}</p><button class="btn big pri" onclick="S={ph:'mode'};R()">Nueva partida</button></div>`;
 else if(ph=='tdone')h+=`${confetti()}<div class="panel big-end"><span class=eico>🎓</span><h2>¡Tutorial completado!</h2><p>Ya conoces captura, combate, evolución, Lucky Box, formas regionales y motes. ¡Elige un modo y sube a la Liga!</p><button class="btn big grn" onclick="S={ph:'mode'};R()">Volver al menú</button></div>`;
 else if(ph=='win')h+=`${confetti()}<div class="panel big-end"><span class=eico>👑</span><h2>¡Eres el campeón de la Liga Pokémon!</h2>${S.mode=='nuz'?`<p>Pokémon muertos: ${S.deaths}</p>`:''}<button class="btn big ylw" onclick="S={ph:'mode'};R()">Nueva partida</button></div>`;
 if(!['starter','load','over','win','end','pick'].includes(ph)&&S.team.length)h+=teamHtml()}
 out(h);S.hit=null;S.evoFx=null}
addEventListener('keydown',e=>{if($('#ov')||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.repeat)return;let k=e.key;if(k==' ')k='Enter';if(k=='Enter'&&document.activeElement&&document.activeElement.tagName=='BUTTON')return;const b=document.querySelector(`[data-k="${k}"]`);if(b&&!b.disabled){e.preventDefault();b.click()}});
R();
</script></body></html>
