<h3>Modos</h3><p><b>Normal:</b> un Pokémon debilitado no puede usarse el resto del tramo y revive al completar un gimnasio (no hay reanimación entre los combates de la Liga). <b>Nuzlocke:</b> un debilitado muere para siempre y suma al contador de muertos; si caen todos, pierdes la partida. Liberar a un Pokémon no cuenta como muerte, pero no podrás recuperarlo. <b>Tutorial:</b> guía paso a paso con parámetros fijos. <b>Random Normal:</b> iniciales (3 al azar de 15) y rutas aleatorias (4 Pokémon por ruta): hasta el 5.º gimnasio solo salen primeras fases y especies de una etapa; después, cualquier fase con bono de evolución; desde el 6.º, también los legendarios. <b>Random Total:</b> igual, y además los Pokémon de entrenadores, líderes y Alto Mando son aleatorios con sus estadísticas originales.</p>
<h3>Capturas</h3><p>Una oportunidad por ruta. Dado 1-3: capturado; 4-5: segunda tirada (1-3 capturado, si no escapa); 6: huye. Las rutas bonus solo se consiguen con la Lucky Box. Cada Pokémon (iniciales incluidos) tiene 1/25 de ser ✨shiny, con +2 de poder y salud; se ve antes de capturarlo. El equipo es de máximo 6: si capturas con el equipo lleno, liberas a uno o dejas ir al nuevo.</p>
<h3>Estadísticas y ataques</h3><p>Poder y vida iniciales = dado × 2, más el bono de rango al capturar. La salud no supera la salud máxima (igual al poder, salvo con Gigamax). Un tipo: ambos ataques de ese tipo. Dos tipos: un ataque de cada uno, al azar.</p>
<h3>Combate</h3><p>Cada turno eliges: <b>básico</b> (daño base ⌊poder/2⌋), <b>cargado</b> (⌊3·poder/4⌋; falla con 1-3), <b>cambiar</b> o <b>curar</b> (consumen el turno y el rival ataca). Modificador por dado: 1 = −2, 2 = −1, 3-4 = 0, 5 = +1, 6 = +2. Daño mínimo 0; supereficaz +2. Los entrenadores comunes solo usan el básico; líderes y Alto Mando a veces usan el cargado. Si los últimos Pokémon de ambos bandos caen en el mismo turno, pierdes.</p>
<h3>Curación</h3><p>Curar restaura toda la vida de un Pokémon. Empiezas con 1 curación y ganas 1 más tras cada gimnasio; se acumulan si no las usas. Ganar a un entrenador cura +2 a todo el equipo y a un líder +5.</p>
<h3>Progresión</h3><p>Inicial → 2 capturas → entrenador → líder, repetido en los 8 gimnasios; tras el 8.º hay 2 capturas más y la Liga (4 combates seguidos + campeón). Los gimnasios dan fichas de evolución: 1, 2 y 3 desde el tercero. Evolucionar (solo entre combates) cuesta fichas según el rango, da bonos de poder y salud y cura toda la vida.</p>
<h3>Lucky Box</h3><p>Tras cada gimnasio. Gym 1-3: 1-3 captura extra, 4-6 curación de +6 al equipo. Desde el Gym 4: 1-2 captura extra, 3-4 curación +6, 5-6 evolución (+3 fichas o forma regional, que cambia tipos y ataques).</p>
<h3>Recompensa de Giovanni</h3><p>Eliges una: <b>Megapiedra</b> (+5 de poder a un Pokémon que pueda megaevolucionar) o <b>Gigamax</b> (+5 de salud máxima y curación total).</p>
<h3>Rangos</h3><p>R1: 1 ficha, +2 al evolucionar. R2: 2 fichas, +3. R3: 2 fichas, +2 al capturar y +3 al evolucionar. R4: 3 fichas, +4. R5: 3 fichas, +2 al capturar y +4 al evolucionar. R6: 5 fichas, +6. R7: +4 al capturar. R8: +10 al capturar.</p></div>`;

 else{let[n,m]=LG[S.li];if(S.li==4)m=m.replace('Gyarados',({bulbasaur:'Charizard',charmander:'Blastoise',squirtle:'Venusaur'}[S.st]||'Gyarados'));t=(S.li<4?'Alto Mando: ':'')+n;l=m.split(',').map(x=>x.split(':')).map(([a,v])=>[a,+v,+v])}
 if(S.mode=='rt')l=l.map(([n,p,h])=>{const q=ALL.filter(x=>k=='liga'||!LEG.includes(x));return[nmz(q[Math.random()*q.length|0]),p,h]});
 const mons=await Promise.all(l.map(([n,p,h])=>mk(n,p,h)));mons.forEach(m=>m.fo=1);S.B={kind:k,title:t,mons,fi:0,cur:null};S.ph='pick';S.lg=[];S.sub=null;R()}
function lead(i){S.B.cur=S.team[i];S.ph='battle';S.sub=null;R()}
function atkCalc(a,d,ch,who){const ty=a.a[ch?1:0],base=ch?Math.floor(3*a.P/4):Math.floor(a.P/2),tx=`${who} usa ${ch?'ataque cargado':'ataque básico'} (${TY[ty][0]})`;
 if(ch){const h=d6();if(h<4)return[0,tx+` — 🎲${h}: ¡falla!`]}
 const r=d6(),m=[-2,-1,0,0,1,2][r-1],se=d.t.some(t=>SE[ty].includes(t));let x=Math.max(0,base+m);if(se)x+=2;
 return[x,tx+` — 🎲${r} (${m>=0?'+':''}${m}): ${x} de daño${se?' ¡supereficaz!':''}`]}
function turn(act,i){const B=S.B,me=B.cur,foe=B.mons[B.fi],L=[];let dF=0;S.sub=null;
 if(act=='sw'){B.cur=S.team[i];L.push(`Cambias a ${B.cur.n}.`)}
 else if(act=='heal'){const p=S.team[i];S.heals--;S.usedHeal=1;p.H=p.M;L.push(`💊 ${p.n} se cura por completo (${p.M} PS).`)}
 else{const[x,t]=atkCalc(me,foe,act=='c',me.n);dF=x;L.push(t)}
 const tg=B.cur,[x2,t2]=atkCalc(foe,tg,B.kind!='trainer'&&Math.random()<.3,foe.n+' (rival)');L.push(t2);
 foe.H=Math.max(0,foe.H-dF);tg.H=Math.max(0,tg.H-x2);
 if(tg.H<=0){L.push(`💥 ${tg.n} se debilita.`);if(S.mode=='nuz'){S.team=S.team.filter(p=>p!==tg);S.dead.push(tg);S.deaths++}else tg.f=1}
 if(foe.H<=0)L.push(`💥 ${foe.n} rival se debilita.`);
 S.lg=L;const left=B.mons.some(m=>m.H>0);
 if(!alive().length){S.won=0;S.res=()=>lose(left?'':'Los últimos Pokémon de ambos bandos cayeron en el mismo turno.');S.ph='end';return R()}
 if(!left){S.won=1;S.res=win;S.ph='end';return R()}
 if(foe.H<=0)B.fi=B.mons.findIndex(m=>m.H>0);
 S.ph=tg.H<=0?'pick':'battle';R()}
function win(){const B=S.B,k=B.kind;S.msg=`🏆 ¡Venciste a ${B.title}!`;
 if(S.mode=='tut'){S.ph='tdone';return R()}
 if(k=='trainer'){alive().forEach(p=>p.H=Math.min(p.M,p.H+2));S.next='gym';S.ph='hub'}
 else if(k=='gym'){S.g++;S.tok+=Math.min(3,S.g);S.team.forEach(p=>{p.f=0});S.team.forEach(p=>p.H=Math.min(p.M,p.H+5));S.heals=Math.min(S.mode=='nuz'?999:5,S.heals+1);S.msg+=` Ganas ${Math.min(3,S.g)} ficha(s) de evolución y +5 PS al equipo${S.mode!='nuz'?'; los debilitados reviven':''}.`;S.ph=S.g==8&&S.team.some(p=>MEGA.has(p.s)||GIGA.has(p.s))?'stone':'luck'}
 else{S.li++;if(S.li>4){S.ph='win';gameWon()}else{S.next='liga';S.ph='hub'}}R()}
function lose(extra){if(S.mode=='nuz'||S.B.kind=='liga'){S.msg=extra;S.ph='over'}
 else{S.team.forEach(p=>{if(p.f){p.f=0;p.H=Math.ceil(p.M/2)}});S.msg=`Perdiste el combate contra ${S.B.title}. ${extra} Tu equipo revive con la mitad de su poder; puedes reintentarlo.`;S.ph='hub'}R()}

// Lucky Box
async function stone(i,k){const p=S.team[i];S.ph='load';R();const im=inf=>{if(!inf.fail){const a=p.sh&&inf.shiny?inf.shiny:inf.img;p.ai=a;if(!S.pm)p.img=a}};
 if(k==1){let inf={fail:1};for(const x of['-mega-y','-mega']){inf=await info(p.s+x);if(!inf.fail)break}p.mg=1;p.P+=5;im(inf);dexK('m:'+p.s,p.ai);if(!inf.fail&&inf.t.join()!=p.t.join()){p.t=inf.t;p.a=atk(inf.t)}S.msg=`💎 ¡${p.n} megaevoluciona! +5 de poder.`}
 else{p.gx=1;p.M+=5;if(!p.f)p.H=p.M;im(await info(p.s+'-gmax'));dexK('g:'+p.s,p.ai);S.msg=`🌀 ¡${p.n} se vuelve Gigamax! +5 de salud máxima y curación total.`}
 S.ph='luck';R()}
async function luck(){const r=S.mode=='tut'?6:d6(),hi=S.g>=4||S.mode=='tut',K=x=>x<=(hi?2:3)?'cap':x<=(hi?4:6)?'heal':'evo',o=K(r);
 const O={cap:['poke-ball','🎒','Captura extra','Puedes intentar capturar un Pokémon más en la Ruta Bonus '+S.g+'.'],heal:['hyper-potion','💊','Curación total','Todo tu equipo recupera +6 PS.'],evo:['rare-candy','🍬','¡Evolución!','Elige entre +3 fichas de evolución o la forma regional de un Pokémon.']},im={};
 await Promise.all(Object.keys(O).map(async k=>im[k]=await itm(O[k][0])));
 const ic=(k,w)=>im[k]?`<img src="${im[k]}" width=${w}>`:'<b>'+O[k][1]+'</b>';
 await spin('🎁 Abriendo Lucky Box…',[1,2,3,4,5,6].map(x=>ic(K(x),96)+`<span>${O[K(x)][2]}</span>`),r-1,`<h1 style="margin:0">${ic(o,170)}</h1><h2>${O[o][2]}</h2><p>${O[o][3]}</p>`);
 S.msg=`🎁 Lucky Box: ${O[o][2]}. `;
 if(o=='cap')startTramo(1);
 else if(o=='heal'){alive().forEach(p=>p.H=Math.min(p.M,p.H+6));startTramo(0)}
 else{S.ph='load';R();S.rg=[];for(const[i,p]of S.team.entries()){if(p.reg)continue;for(const x of['alola','galar','hisui']){const inf=await info(p.s+'-'+x);if(!inf.fail){S.rg.push([i,x,inf]);break}}}S.ph='luckevo';R()}}
function ficha(){S.tok+=3;S.msg='Ganas +3 fichas de evolución.';startTramo(0)}
async function regional(k){const[i,x,inf]=S.rg[k],p=S.team[i],a=p.sh&&inf.shiny?inf.shiny:inf.img;p.reg=x;p.t=inf.t;p.a=atk(inf.t);if(!p.nn)p.n+=' ('+x+')';p.ai=a;p.img=S.pm?await paintIt(a,p.n):a;dexK('r:'+p.s+'-'+x,a);unlock('r');S.trg=1;S.msg=`${p.n} cambia a su forma regional.`;startTramo(0)}

// Render
const rk=p=>{const r=RK[p.s]||RK[(EV[p.s]||{}).base];return r?r.r:0};
const dm=p=>{let t=`⚔ Básico: ${TY[p.a[0]][0]} · ${Math.floor(p.P/2)} de daño\n💥 Cargado: ${TY[p.a[1]][0]} · ${Math.floor(3*p.P/4)} de daño (falla 50%)\n(dado: de -2 a +2; +2 si es supereficaz)`;if(!p.fo){const r=rk(p),e=evo(p);if(r)t+=`\n🏅 Rango ${r}`;if(e)t+=`\n⬆ Al evolucionar: +${e.evo} de poder y salud (${e.cost} fichas)`}return t};
const card=(p,extra='')=>`<div class="pk ${p.f?'f':''}" data-tip="${dm(p)}">${p.img?`<img class="${p.sh?'shn':''}" src="${p.img}" alt="" onerror="this.style.display='none'">`:''}<b>${p.sh?'✨ ':''}${p.mg?'Mega ':''}${p.gx?'G-Max ':''}${p.n}</b>${p.nn?`<small>(${pretty(p.s)})</small>`:''}<div>${chips(p.t)}</div>${bar(p)}<span>❤ ${p.H}/${p.M} ⚡${p.P}${p.f?' 💤':''}</span><small>⚔ ${TY[p.a[0]][0]} / ${TY[p.a[1]][0]}</small>${extra}</div>`;
function teamHtml(){const m=['cap','hub','rel'].includes(S.ph);return `<h3>Tu equipo (${S.team.length}/6)</h3><div class=tm>${S.team.map((p,i)=>{let a='';if(m){const e=evo(p);if(e&&S.ph!='rel')a+=`<button ${S.tok>=e.cost?'':'disabled'} onclick="evolve(${i})">⬆ ${pretty(e.to)} (${e.cost}🔸)</button>`;a+=`<button onclick="nick(${i})">✏ Mote</button><button class=rl onclick="rel(${i})">Liberar</button>`}return card(p,a)}).join('')}</div>${S.dead.length?`<small>☠ Descartes: ${S.dead.map(p=>p.n).join(', ')}</small>`:''}`}
function R(){if(RX){const i=rulesHtml.indexOf('<div class=lg');$('#app').innerHTML=tr(rulesHtml.slice(0,i))+rulesHtml.slice(i);return}if(SX)return out(setHtml());if(AX)return out(achHtml());if(DX)return out(dexHtml());const ph=S.ph;let h='<h1>📓 Pokepaper</h1><p class=ctr><button onclick="DX=1;R()">📖 Pokédex</button> <button onclick="RX=1;R()">📜 Reglas</button> <button onclick="AX=1;R()">🏆 Logros</button> <button onclick="SX=1;R()">⚙ Ajustes</button>'+(S.ph!='mode'?' <button class=rl onclick="giveUp()">🏳 Rendirse</button>':'')+'</p>';
 if(ph=='mode')h+=`<div class=msg id=fact>💡 ${FACTS[FI]}</div><h2 class=ctr>Elige el modo de juego</h2><p class=ctr>🖼 Imágenes: <button ${SET.pm?'':'disabled'} onclick="SET.pm=0;sS();R()">Normal</button> <button ${SET.pm?'disabled':''} onclick="SET.pm=1;sS();R()">🎨 Pintor</button></p><div class=opts><button class=mode onclick="init('normal')"><h2>Modo normal</h2>Los Pokémon debilitados quedan fuera hasta completar el gimnasio, cuando reviven.</button><button class=mode onclick="init('nuz')"><h2>☠ Modo Nuzlocke</h2>Un Pokémon debilitado muere para siempre. Si caen todos, pierdes la partida.</button><button class=mode onclick="init('tut')"><h2>🎓 Tutorial</h2>Aprende las mecánicas paso a paso.</button><button class=mode onclick="RM=!RM;R()"><h2>🎲 Modo Random</h2>Iniciales y Pokémon aleatorios.</button></div>${RM?`<div class=opts><button class=mode onclick="init('rn')"><h2>🎲 Random Normal</h2>Iniciales y rutas aleatorias; los rivales no cambian.</button><button class=mode onclick="init('rt')"><h2>🎲🎲 Random Total</h2>Además, entrenadores, líderes y Alto Mando son aleatorios.</button></div>`:''}`;
 else{if(ph!='starter')h+=`<div class=st><span>${{nuz:'☠ Nuzlocke',tut:'🎓 Tutorial',rn:'🎲 Random Normal',rt:'🎲 Random Total'}[S.mode]||'Normal'}</span><span>🏅 Gimnasios ${S.g}/8</span><span>🔸 Fichas: ${S.tok}</span><span>💊 Curaciones: ${S.heals}${S.mode=='nuz'?'':'/5'}</span>${S.mode=='nuz'?`<span>💀 Muertos: ${S.deaths}</span>`:''}</div>`;
 if(S.msg&&ph!='over')h+=`<div class=msg>${S.msg}</div>`;if(S.mode=='tut'&&tip())h+=`<div class=lg>🎓 <b>Tutorial:</b> ${tip()}</div>`;
 if(ph=='starter'){const u=i=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${i}.png`;h+=`<h2 class=ctr>Elige a tu Pokémon inicial</h2><div class=opts style="justify-content:center">${(S.stl||[['Bulbasaur',1],['Charmander',4],['Squirtle',7]]).map(([n,i],k)=>`<button class=pk onclick="starter('${n}',${k})"><img class="${S.sh[k]?'shn':''}" src="${S.sh[k]?u('shiny/'+i):u(i)}" alt=""><b>${S.sh[k]?'✨ ':''}${n}</b></button>`).join('')}</div>`}
 else if(ph=='load')h+='<h2 class=ctr>Cargando…</h2>';
 else if(ph=='cap'){const c=S.q[0];h+=`<h2>🎒 ${c.l}</h2><p>Solo tienes un intento por ruta. Quedan ${S.q.length} ruta(s) en este tramo.</p>${c.mon?`<div class=ctr>${c.img?`<img class="${c.sh?'shn':''}" src="${c.img}" width=140 alt="">`:''}<h3>${c.sh?'✨ ':''}${c.mon}${c.sh?' SHINY ✨':''}</h3><button class=big onclick="ball()">🎲 Lanzar Pokéball</button></div>`:`<button class=big onclick="explore()">🎲 Explorar ruta</button>`}`}
 else if(ph=='rel')h+=`<h2>Equipo completo</h2><p>Libera a uno de tus Pokémon para que entre <b>${S.pend.n}</b> (poder ${S.pend.P}).</p><div class=tm>${card(S.pend)}</div><p><button class=big onclick="skip()">🚫 No capturarlo (dejarlo ir)</button></p>`;
 else if(ph=='hub'){const k=S.next,w=k=='trainer'?'Entrenador '+(S.g+1):k=='gym'?'Líder '+GY[S.g][0]:LG[S.li][0];h+=`<h2>Siguiente combate: ${w}</h2><p>Evoluciona o libera Pokémon ahora; no se puede durante el combate.</p><button class=big onclick="fight()">⚔ Combatir</button>${S.mode=='tut'&&!S.tlb?' <button class=big onclick="tlb()">🎁 Probar Lucky Box</button>':''}`}
 else if(ph=='luck')h+=`<h2>🎁 Lucky Box</h2><button class=big onclick="luck()">🎲 Abrir</button>`;
 else if(ph=='luckevo')h+=`<h2>🍬 Evolución</h2><button class=big onclick="ficha()">+3 fichas de evolución</button><h3>…o cambiar a forma regional:</h3><div class=opts>${S.rg.map(([i,x],k)=>`<button onclick="regional(${k})">${S.team[i].n} → ${x}</button>`).join('')||'Ninguno de tus Pokémon tiene forma regional disponible.'}</div>`;
 else if(ph=='stone'){const o=S.team.map((p,i)=>[p,i]);h+=`<h2>🏆 Recompensa de Giovanni</h2><p>Elige <b>una</b>: una Megapiedra (+5 de poder a un Pokémon que pueda megaevolucionar) o un Gigamax (+5 de salud máxima y curación total).</p><div class=opts>${o.filter(([p])=>MEGA.has(p.s)&&!p.mg).map(([p,i])=>`<button onclick="stone(${i},1)">💎 Mega ${p.n}</button>`).join('')}${o.filter(([p])=>GIGA.has(p.s)).map(([p,i])=>`<button onclick="stone(${i},2)">🌀 Gigamax ${p.n}</button>`).join('')}</div>`}
 else if(ph=='pick')h+=`<h2>${S.B.title}</h2><h3>Elige tu Pokémon</h3><div class=tm>${S.team.map((p,i)=>!p.f&&p.H>0?`<button class=pk onclick="lead(${i})" style="padding:0">${card(p)}</button>`:'').join('')}</div>${log()}`;
 else if(ph=='battle'){const B=S.B,me=B.cur,f=B.mons[B.fi],sub=S.sub;h+=`<h2>${B.title} <small>(rival ${B.fi+1}/${B.mons.length})</small></h2><div class=vs>${card(f)}${card(me)}</div>`;
  if(sub){const o=S.team.map((p,i)=>({p,i})).filter(({p})=>!p.f&&p.H>0&&(sub=='sw'?p!==me:p.H<p.M));h+=`<h3>${sub=='sw'?'¿A quién sacas?':'¿A quién curas? (recupera toda su vida)'}</h3><div class=tm>${o.map(({p,i})=>`<button class=pk onclick="turn('${sub}',${i})" style="padding:0">${card(p)}</button>`).join('')||'Nadie necesita curación.'}</div><button onclick="S.sub=null;R()">Cancelar</button>`}
  else h+=`<div class=ac><button onclick="turn('b')">⚔ Básico · ${TY[me.a[0]][0]} (${Math.floor(me.P/2)})</button><button onclick="turn('c')">💥 Cargado · ${TY[me.a[1]][0]} (${Math.floor(3*me.P/4)}, falla 50%)</button><button onclick="S.sub='sw';R()">🔄 Cambiar</button><button ${S.heals>0?'':'disabled'} onclick="S.sub='heal';R()">💊 Curar (${S.heals})</button></div>`;h+=log()}
 else if(ph=='end'){const B=S.B;h+=`<h2>${B.title}</h2><div class=vs>${card(B.mons[B.fi])}${card(B.cur)}</div>${log()}<div class="msg ctr" style="font-size:1.4em">${S.won?'🏆 ¡Ganaste el combate!':'💀 Perdiste el combate'}</div><p class=ctr><button class=big onclick="S.res()">Continuar ▶</button></p>`}
 else if(ph=='over')h+=`<h2 class=ctr>💀 Fin de la partida</h2><p class=ctr>${S.msg||''} Llegaste a ${S.g} gimnasio(s).${S.mode=='nuz'?` Pokémon muertos: ${S.deaths}.`:''}</p><p class=ctr><button class=big onclick="S={ph:'mode'};R()">Nueva partida</button></p>`;
 else if(ph=='tdone')h+=`<h2 class=ctr>🎓 ¡Tutorial completado!</h2><p class=ctr>Ya conoces captura, combate, evolución, Lucky Box, formas regionales y motes. ¡Elige un modo y sube a la Liga!</p><p class=ctr><button class=big onclick="S={ph:'mode'};R()">Volver al menú</button></p>`;
 else if(ph=='win')h+=`<h2 class=ctr>🏆 ¡Eres el campeón de la Liga Pokémon!</h2>${S.mode=='nuz'?`<p class=ctr>Pokémon muertos: ${S.deaths}</p>`:''}<p class=ctr><button class=big onclick="S={ph:'mode'};R()">Nueva partida</button></p>`;
 if(!['starter','load','over','win','end'].includes(ph)&&S.team.length&&ph!='pick')h+=teamHtml();
 if(ph=='pick')h+=''}
 out(h)}
const log=()=>S.lg.length?`<div class=lg>${S.lg.map(x=>`<p>${x}</p>`).join('')}</div>`:'';
R();
</script></body></html>
